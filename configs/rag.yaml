knowledge_base:
  input_path: "data/knowledge/knowledge_base.jsonl"
  sample_path: "data/knowledge/knowledge_base_sample.jsonl"

vector_db:
  provider: "chroma"
  persist_dir: "vector_db/chroma"
  collection_name: "cultural_knowledge"

embedding:
  model_name: "keepitreal/vietnamese-sbert"
  batch_size: 64
  normalize_embeddings: true
  device: "auto"

retrieval:
  top_k: 5
  score_threshold: null

inference:
  top_k: 5
  max_context_chars: 3500
  use_category_filter: false
  use_keyword_filter: false

stats:
  knowledge_base_validation_stats_path: "data/stats/knowledge_base_validation_stats.json"
  knowledge_base_stats_path: "data/stats/knowledge_base_stats.json"
  retrieval_smoke_test_results_path: "data/stats/retrieval_smoke_test_results.json"

logging:
  level: "INFO"

generation:
  provider: "huggingface_peft"
  base_model: "Qwen/Qwen2.5-3B-Instruct"
  adapter_model: "ohthisischichi/viet-cultural-qa-qwen2.5-lora"
  device: "auto"
  torch_dtype: "float16"
  max_new_tokens: 128
  temperature: 0.0
  top_p: 0.9
  do_sample: false